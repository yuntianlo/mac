name: Build randconf IPK

on:
  # 打 tag 自动编译并发布到对应 Release（推荐用法：git tag v24.10.4 && git push --tags）
  push:
    tags:
      - "v*"
  # 手动触发，仅上传 Artifact 供调试，不出 Release
  workflow_dispatch:
    inputs:
      release_tag:
        description: "ImmortalWrt 发布版本号，需与路由器固件一致，例如 v24.10.4"
        required: true
        default: "v24.10.4"

env:
  REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
  ARCH: ramips-mt7621

permissions:
  contents: write   # 打 tag 时创建/更新 Release 附件需要

jobs:
  build:
    runs-on: ubuntu-latest
    # 防御性超时：纯脚本包正常 3~8 分钟即可完成，30 分钟足够；
    # 若某步骤卡死会快速失败，而不是白等 6 小时被 GitHub 取消
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装编译主机依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk \
            git subversion libssl-dev gettext unzip zlib1g-dev file wget zstd

      - name: 缓存 ImmortalWrt SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          # 解压后的 SDK 整目录，按版本号+架构做缓存键
          path: sdk
          key: sdk-${{ env.REL_TAG }}-${{ env.ARCH }}
          restore-keys: |
            sdk-${{ env.REL_TAG }}-

      - name: 下载并解压 SDK (ramips/mt7621)
        run: |
          # 若上一次缓存已恢复且 SDK 完整，直接复用，避免重复下载
          if [ -f sdk/Makefile ] && [ -d sdk/package ]; then
            echo "SDK 缓存有效，跳过下载"
            exit 0
          fi
          rm -rf sdk
          VER="${REL_TAG#v}"   # 去掉 v 前缀 -> 24.10.4
          BASE="https://downloads.immortalwrt.org/releases/${VER}/targets/ramips/mt7621"
          ASSET=$(curl -fsSL "$BASE/" | grep -oiE "immortalwrt-sdk-${VER}-${ARCH}_[^\"<> ]+\.tar\.zst" | head -n1)
          if [ -z "$ASSET" ]; then
            echo "ERROR: 在 $BASE/ 未找到 SDK 资源，目录内容如下:"
            curl -fsSL "$BASE/"
            exit 1
          fi
          echo "使用的 SDK 资源: $ASSET"
          wget -q "${BASE}/${ASSET}"
          mkdir -p sdk && tar -I zstd -xf "$ASSET" -C sdk --strip-components=1
          rm -f "$ASSET"
          # 健全性检查：解压后必须存在 Makefile
          if [ ! -f sdk/Makefile ]; then
            echo "ERROR: SDK 解压后缺少 Makefile，解压可能失败"
            exit 1
          fi

      - name: 放入 randconf 包源码
        run: |
          rm -rf sdk/package/randconf
          mkdir -p sdk/package/randconf
          cp -r Makefile files sdk/package/randconf/

      - name: 编译 IPK
        working-directory: sdk
        run: |
          # randconf 是纯脚本包（PKGARCH:=all），编译只是打包 files/ 目录，
          # 不依赖任何 feed 的源码（luci-base 仅作为依赖元数据写入 ipk，
          # 由 opkg 安装时解析）。因此跳过 feeds update/install —— 那一步
          # 要拉取几十个 git 仓库，在公共 runner 上极易长时间卡住（曾导致 6h 超时）。
          echo "CONFIG_PACKAGE_randconf=m" >> .config
          make defconfig || true
          # 清掉上一次缓存可能残留的旧 ipk，避免上传到过期的包
          rm -f bin/packages/*/base/randconf_*.ipk
          make package/randconf/compile V=s

      - name: 收集产物路径
        id: ipk
        run: |
          IPK=$(ls sdk/bin/packages/*/base/randconf_*.ipk | head -n1)
          echo "ipk=$IPK" >> "$GITHUB_OUTPUT"
          echo "产物: $IPK"

      - name: 上传 IPK 到 Artifact（始终保留，便于手动调试）
        uses: actions/upload-artifact@v5
        with:
          name: randconf-ipk
          path: ${{ steps.ipk.outputs.ipk }}

      - name: 发布到对应 tag 的 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ipk.outputs.ipk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
